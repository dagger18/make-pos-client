# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    driver: "gd"
    loaders:
        media:
            flysystem:
                filesystem_service: 'media.storage'
    data_loader: media

    resolvers:
        default:
            web_path: ~
    filter_sets:
        cache: ~
        pdf_logo:
            data_loader: thumbnailLoader
            quality: 100
            filters:
                thumbnail: { size: [150, 150], mode: inset }
        avatar_thumb:
            quality: 85
            filters:
                thumbnail: { size: [200, 200], mode: outbound }
        thumbnail:
            data_loader: thumbnailLoader
            format: webp
            quality: 85
            filters:
                thumbnail: { size: [200, 200], mode: outbound }
    twig:
        mode: lazy       